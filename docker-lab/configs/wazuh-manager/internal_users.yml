---
# This is the internal user database
# The hash value is a bcrypt hash and can be generated with plugin/tools/hash.sh
#
# Redigierte Kopie — die echten bcrypt-Hashes liegen nur lokal in
# ~/HOMELAB/migration-export/ (nicht im Repo).

_meta:
  type: "internalusers"
  config_version: 2

# Define your internal users here

## Demo users

admin:
  hash: "<BCRYPT_HASH>"
  reserved: true
  backend_roles:
  - "admin"
  description: "Demo admin user"

kibanaserver:
  hash: "<BCRYPT_HASH>"
  reserved: true
  description: "Demo kibanaserver user"

kibanaro:
  hash: "<BCRYPT_HASH>"
  reserved: false
  backend_roles:
  - "kibanauser"
  - "readall"
  attributes:
    attribute1: "value1"
    attribute2: "value2"
    attribute3: "value3"
  description: "Demo kibanaro user"

logstash:
  hash: "<BCRYPT_HASH>"
  reserved: false
  backend_roles:
  - "logstash"
  description: "Demo logstash user"

readall:
  hash: "<BCRYPT_HASH>"
  reserved: false
  backend_roles:
  - "readall"
  description: "Demo readall user"

snapshotrestore:
  hash: "<BCRYPT_HASH>"
  reserved: false
  backend_roles:
  - "snapshotrestore"
  description: "Demo snapshotrestore user"
