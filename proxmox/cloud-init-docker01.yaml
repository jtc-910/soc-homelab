#cloud-config
# cloud-init user-data for docker01 (Ubuntu Server LTS amd64 cloud image), applied via
# Proxmox's cloud-init drive (see create-vms.sh). Static IP claims the full disk on
# first boot instead of the installer's usual half-disk default (99-troubleshooting.md).

hostname: docker01
fqdn: docker01.lab.local
manage_etc_hosts: true

users:
  - name: wazuh
    groups: [sudo, docker]
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    ssh_authorized_keys:
      # Replace with the admin workstation's actual public key before first boot
      - ssh-ed25519 AAAA...REPLACE-ME... jonas@macbook

# Key-only SSH (linux-lab/01-ssh-hardening.md). The drop-in below enforces it too, because
# cloud-init's own 50-cloud-init.conf would otherwise win over the main sshd_config.
ssh_pwauth: false

package_update: true
package_upgrade: true

packages:
  - docker.io
  - docker-compose-v2
  - ufw
  - fail2ban
  - unattended-upgrades

# Network comes from Proxmox's own cloud-init integration (qm set --ipconfig0 in
# create-vms.sh), not a hand-written netplan file. Confirmed on the running VM: the
# virtio-net NIC still comes up as eth0 here (not the predictable ens18 name Ubuntu 24.04
# uses on real/PCI hardware) -- Proxmox's NoCloud network-config targets it by MAC either way.

write_files:
  # virtio-net TX checksum offload corrupts UDP packets (notably DNS) behind Proxmox's
  # NAT bridge (vmbr1) -- without this, apt/docker pull fail intermittently. ethtool
  # settings don't survive a reboot, so this needs a real unit, not a one-shot runcmd.
  # See docker01-network-fixes.md.
  - path: /etc/systemd/system/disable-eth0-tx-offload.service
    content: |
      [Unit]
      Description=Disable virtio-net tx checksum offload (works around UDP corruption behind Proxmox NAT bridge)
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=oneshot
      ExecStart=/usr/sbin/ethtool -K eth0 tx off
      RemainAfterExit=yes

      [Install]
      WantedBy=multi-user.target
    permissions: '0644'
  - path: /etc/systemd/resolved.conf.d/99-static-dns.conf
    content: |
      [Resolve]
      DNS=1.1.1.1 1.0.0.1
      DNSStubListener=no
    permissions: '0644'
  # 1.7 hardening, re-applied after the Proxmox rebuild. sshd reads sshd_config.d in
  # lexical order and keeps the FIRST value it sees, so 10- beats cloud-init's 50-.
  - path: /etc/ssh/sshd_config.d/10-hardening.conf
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin no
    permissions: '0644'
  - path: /etc/fail2ban/jail.local
    content: |
      [sshd]
      enabled = true
      port = ssh
      maxretry = 3
      bantime = 3600
      findtime = 600
    permissions: '0644'
  # Security-origin updates are already the Ubuntu default; this only adds the cleanup and
  # the nightly reboot window. A separate file instead of editing 50unattended-upgrades.
  - path: /etc/apt/apt.conf.d/52unattended-upgrades-local
    content: |
      Unattended-Upgrade::Remove-Unused-Kernel-Packages "true";
      Unattended-Upgrade::Automatic-Reboot "true";
      Unattended-Upgrade::Automatic-Reboot-Time "03:00";
    permissions: '0644'

runcmd:
  # Claim the full disk (the cloud image otherwise only partitions half of it)
  - growpart /dev/sda 1
  - resize2fs /dev/sda1
  - systemctl enable --now disable-eth0-tx-offload.service
  - systemctl restart systemd-resolved
  # UFW: default deny incoming, but explicitly allow SSH + the ports the Wazuh/TheHive/
  # DVWA stacks publish. Docker's published ports insert iptables rules *before* UFW's
  # own chain, so this alone won't fully close Docker-published ports to the internet --
  # see the migration plan's Phase D2 note on the DOCKER-USER chain. This at least covers
  # the host-level SSH/management access.
  - ufw allow OpenSSH
  - ufw allow 443/tcp
  - ufw allow 9200/tcp
  - ufw allow 1514/tcp
  - ufw allow 1515/tcp
  - ufw allow 514/udp
  - ufw allow 55000/tcp
  - ufw allow 9000/tcp
  - ufw allow 9001/tcp
  - ufw allow 8443/tcp
  - ufw allow 8080/tcp
  - ufw allow 3000/tcp
  - ufw --force enable
  - systemctl enable --now docker
  - systemctl enable --now fail2ban
  - systemctl restart ssh
  # Unused on a headless VM; not every one exists on the cloud image, hence || true
  - systemctl disable --now ModemManager.service multipathd.service multipathd.socket udisks2.service || true

final_message: "docker01 cloud-init done. Next: docker-lab/scripts/restore-stacks.sh"
