#cloud-config
# cloud-init user-data for docker01 (Ubuntu Server LTS amd64 cloud image), applied via
# Proxmox's cloud-init drive (see create-vms.sh). Static IP claims the full disk on
# first boot instead of the installer's usual half-disk default (99-troubleshooting.md).

hostname: docker01
fqdn: docker01.lab.local
manage_etc_hosts: true

users:
  - name: wazuh
    groups: [sudo, docker]
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    ssh_authorized_keys:
      # Replace with the Mac's actual public key before first boot
      - ssh-ed25519 AAAA...REPLACE-ME... jonas@macbook

package_update: true
package_upgrade: true

packages:
  - docker.io
  - docker-compose-v2
  - ufw

runcmd:
  # Claim the full disk (the cloud image otherwise only partitions half of it)
  - growpart /dev/sda 1
  - resize2fs /dev/sda1
  # UFW: default deny incoming, but explicitly allow SSH + the ports the Wazuh/TheHive/
  # DVWA stacks publish. Docker's published ports insert iptables rules *before* UFW's
  # own chain, so this alone won't fully close Docker-published ports to the internet --
  # see the migration plan's Phase D2 note on the DOCKER-USER chain. This at least covers
  # the host-level SSH/management access.
  - ufw allow OpenSSH
  - ufw allow 443/tcp
  - ufw allow 9200/tcp
  - ufw allow 1514/tcp
  - ufw allow 1515/tcp
  - ufw allow 514/udp
  - ufw allow 55000/tcp
  - ufw allow 9000/tcp
  - ufw allow 9001/tcp
  - ufw allow 8443/tcp
  - ufw allow 8080/tcp
  - ufw allow 3000/tcp
  - ufw --force enable
  - systemctl enable --now docker
  - netplan apply

write_files:
  - path: /etc/netplan/99-static.yaml
    content: |
      network:
        version: 2
        ethernets:
          eth0:
            dhcp4: false
            addresses: [192.168.100.30/24]
            routes:
              - to: default
                via: 192.168.100.1
            nameservers:
              addresses: [192.168.100.1, 1.1.1.1]
    permissions: '0600'

final_message: "docker01 cloud-init done. Next: docker-lab/scripts/restore-stacks.sh"
